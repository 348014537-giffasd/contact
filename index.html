<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact Us - Bize Ulaşın</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Playfair Display for headers, Inter for text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: {
                            50: '#FFFEFA',
                            100: '#FAF8F5',
                            200: '#F5EFE6',
                            300: '#E8DFD1',
                        },
                        amberGold: {
                            500: '#D4AF37',
                            600: '#C59B27',
                            700: '#A37E1C',
                        },
                        turkishDark: '#2C221E',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FAF8F5;
            color: #2C221E;
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(#D4AF37 0.5px, transparent 0.5px), radial-gradient(#D4AF37 0.5px, #FAF8F5 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-opacity: 0.05;
        }

        /* Subtle Islamic/Turkish geometric pattern border background overlay */
        .turkish-pattern-bg {
            background-color: #FFFDF9;
            background-image: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.06) 0%, transparent 60%);
        }

        /* Deluxe Card Elevation & Shadows */
        .contact-card {
            background: rgba(255, 253, 249, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.08), 0 8px 10px -6px rgba(44, 34, 30, 0.03);
        }

        /* Toast Animation */
        #toast {
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            transform: translateY(100px) scale(0.9);
            opacity: 0;
        }
        #toast.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* Subtle pulsing highlight for primary action button */
        .btn-glow {
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-glow:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center px-4 py-6 selection:bg-amberGold-500 selection:text-white">

    <div class="w-full max-w-md mx-auto space-y-6">

        <!-- Top Header Banner Frame -->
        <div class="relative pt-6 pb-2 text-center">
            <!-- Turkish Geometric Arch Svg Top Ornament -->
            <div class="flex justify-center mb-2">
                <svg width="60" height="20" viewBox="0 0 60 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30 0C20 12 10 15 0 15V20H60V15C50 15 40 12 30 0Z" fill="#D4AF37" fill-opacity="0.2"/>
                    <circle cx="30" cy="14" r="3" fill="#D4AF37"/>
                </svg>
            </div>

            <!-- Page Title -->
            <h1 class="font-serif text-3xl font-bold text-turkishDark tracking-wide">Contact Us</h1>
            <p class="text-sm font-medium text-amberGold-600 tracking-widest uppercase mt-1">Bize Ulaşın</p>
            <p class="text-xs text-stone-500 mt-1">We are here to help you 24/7</p>

            <!-- Decorative Divider -->
            <div class="flex items-center justify-center space-x-2 mt-4">
                <div class="h-[1px] w-12 bg-gradient-to-r from-transparent to-amberGold-500/50"></div>
                <div class="w-2 h-2 rotate-45 border border-amberGold-600"></div>
                <div class="h-[1px] w-12 bg-gradient-to-l from-transparent to-amberGold-500/50"></div>
            </div>
        </div>

        <!-- SECTION 1: CHINESE OFFICIAL -->
        <div class="contact-card rounded-2xl p-5 relative overflow-hidden transition-all duration-300 hover:border-amberGold-500/50">
            <!-- Decorative Arch Corner Motif -->
            <div class="absolute top-0 right-0 w-16 h-16 pointer-events-none opacity-20">
                <svg viewBox="0 0 100 100" fill="none" stroke="#D4AF37" stroke-width="2">
                    <path d="M100,0 L100,100 C100,44.77 55.23,0 0,0 L100,0 Z" fill="rgba(212,175,55,0.1)"></path>
                </svg>
            </div>

            <!-- Header Badge -->
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-amberGold-500/10 border border-amberGold-500/30 flex items-center justify-center text-amberGold-700">
                    <i class="fa-solid fa-headset text-lg"></i>
                </div>
                <div>
                    <h2 class="font-semibold text-lg text-turkishDark">Chinese Official</h2>
                    <p class="text-xs text-stone-500">Official Service Team</p>
                </div>
            </div>

            <!-- Details List -->
            <div class="space-y-3">
                <!-- WhatsApp Item -->
                <div class="bg-cream-100/80 rounded-xl p-3 border border-cream-200/80 flex items-center justify-between">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="w-8 h-8 rounded-lg bg-emerald-500/10 flex items-center justify-center text-emerald-600 flex-shrink-0">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                        </div>
                        <div class="truncate">
                            <p class="text-[10px] uppercase font-semibold text-stone-400 tracking-wider">WhatsApp</p>
                            <p class="text-sm font-semibold text-turkishDark font-mono tracking-tight">+86 19925787935</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1.5 flex-shrink-0">
                        <!-- Copy Button -->
                        <button onclick="copyToClipboard('+8619925787935', 'WhatsApp Number')" 
                                class="p-2 text-xs bg-amberGold-500/15 hover:bg-amberGold-500/25 text-amberGold-700 rounded-lg flex items-center justify-center transition-all active:scale-95 border border-amberGold-500/30"
                                title="Copy WhatsApp">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>

                <!-- ID Item -->
                <div class="bg-cream-100/80 rounded-xl p-3 border border-cream-200/80 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg bg-amberGold-500/10 flex items-center justify-center text-amberGold-600 flex-shrink-0">
                            <i class="fa-solid fa-id-card text-sm"></i>
                        </div>
                        <div>
                            <p class="text-[10px] uppercase font-semibold text-stone-400 tracking-wider">Official ID</p>
                            <p class="text-sm font-semibold text-turkishDark font-mono">300000</p>
                        </div>
                    </div>
                    <!-- Copy Button -->
                    <button onclick="copyToClipboard('300000', 'Official ID')" 
                            class="p-2 text-xs bg-amberGold-500/15 hover:bg-amberGold-500/25 text-amberGold-700 rounded-lg flex items-center justify-center transition-all active:scale-95 border border-amberGold-500/30">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- SECTION 2: SUPERADMIN -->
        <div class="contact-card rounded-2xl p-5 relative overflow-hidden transition-all duration-300 hover:border-amberGold-500/50">
            <!-- Decorative Arch Corner Motif -->
            <div class="absolute top-0 right-0 w-16 h-16 pointer-events-none opacity-20">
                <svg viewBox="0 0 100 100" fill="none" stroke="#D4AF37" stroke-width="2">
                    <path d="M100,0 L100,100 C100,44.77 55.23,0 0,0 L100,0 Z" fill="rgba(212,175,55,0.1)"></path>
                </svg>
            </div>

            <!-- Header Badge -->
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-amberGold-500/10 border border-amberGold-500/30 flex items-center justify-center text-amberGold-700">
                    <i class="fa-solid fa-user-shield text-lg"></i>
                </div>
                <div>
                    <h2 class="font-semibold text-lg text-turkishDark">Superadmin</h2>
                    <p class="text-xs text-stone-500">System Administrator</p>
                </div>
            </div>

            <!-- Details List -->
            <div class="space-y-3">
                <!-- ID & Name Item -->
                <div class="bg-cream-100/80 rounded-xl p-3.5 border border-cream-200/80 flex items-center justify-between">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="w-8 h-8 rounded-lg bg-amberGold-500/10 flex items-center justify-center text-amberGold-600 flex-shrink-0">
                            <i class="fa-solid fa-crown text-sm"></i>
                        </div>
                        <div class="truncate">
                            <p class="text-[10px] uppercase font-semibold text-stone-400 tracking-wider">Superadmin ID</p>
                            <div class="flex items-baseline space-x-2">
                                <span class="text-sm font-semibold text-turkishDark font-mono">300001</span>
                                <span class="text-xs font-semibold text-amberGold-700 font-serif">ᴛͣeᷤᴋͥḭʟᴀ</span>
                            </div>
                        </div>
                    </div>
                    <!-- Copy Button -->
                    <button onclick="copyToClipboard('300001 ᴛͣeᷤᴋͥḭʟᴀ', 'Superadmin ID')" 
                            class="p-2 text-xs bg-amberGold-500/15 hover:bg-amberGold-500/25 text-amberGold-700 rounded-lg flex items-center justify-center transition-all active:scale-95 border border-amberGold-500/30">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Quick Copy Number Button -->
        <div class="pt-2">
            <button onclick="copyToClipboard('+8619925787935', 'WhatsApp Number')" 
               class="btn-glow w-full py-3.5 px-4 bg-gradient-to-r from-amberGold-500 via-amberGold-600 to-amberGold-700 hover:from-amberGold-600 hover:to-amberGold-700 text-white font-medium rounded-xl flex items-center justify-center space-x-2 text-sm shadow-md transition-all">
                <i class="fa-regular fa-copy text-lg"></i>
                <span>Copy WhatsApp Number</span>
            </button>
        </div>

        <!-- Bottom Turkish Ornament Motif -->
        <div class="text-center pt-4 opacity-40">
            <svg class="mx-auto" width="80" height="15" viewBox="0 0 80 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 7.5H30M50 7.5H80" stroke="#D4AF37" stroke-width="1"/>
                <circle cx="40" cy="7.5" r="4" stroke="#D4AF37" stroke-width="1" fill="#FAF8F5"/>
                <circle cx="40" cy="7.5" r="1.5" fill="#D4AF37"/>
            </svg>
            <p class="text-[11px] text-stone-400 mt-2">© Official Support Team • All Rights Reserved</p>
        </div>

    </div>

    <!-- Floating Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-turkishDark text-cream-100 px-4 py-2.5 rounded-full shadow-xl border border-amberGold-500/40 flex items-center space-x-2 text-xs font-medium pointer-events-none">
        <i class="fa-solid fa-circle-check text-amberGold-500 text-sm"></i>
        <span id="toast-msg">Copied to clipboard!</span>
    </div>

    <script>
        /**
         * Copy text to clipboard and display toast notification
         */
        function copyToClipboard(text, label) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(`${label} copied!`);
                }).catch(() => {
                    legacyCopy(text, label);
                });
            } else {
                legacyCopy(text, label);
            }
        }

        function legacyCopy(text, label) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`${label} copied!`);
            } catch (err) {
                showToast(`Failed to copy`);
            }
            document.body.removeChild(textArea);
        }

        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            
            toastMsg.innerText = message;
            toast.classList.add('show');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }
    </script>
</body>
</html>
