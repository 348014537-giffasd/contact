<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Chinese Official</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter and Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* Subtle Soft Turkish Geometric Tile Pattern Background Overlay */
        .turkish-light-pattern {
            background-color: #f5f3ff;
            background-image: 
                radial-gradient(#818cf8 0.75px, transparent 0.75px), 
                radial-gradient(#818cf8 0.75px, #f5f3ff 0.75px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            opacity: 0.6;
        }

        /* Delicate Turkish Gold-Azure Accent Border Bar */
        .turkish-tile-bar {
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 35%, #eab308 50%, #a855f7 65%, #6366f1 100%);
        }

        /* Soft Glow Glassmorphism effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(199, 210, 254, 0.6);
        }

        /* Toast animation classes */
        .toast-transition {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4 text-slate-800">

    <!-- Main Mobile Container -->
    <div class="w-full max-w-md bg-gradient-to-b from-indigo-50/90 via-purple-50/60 to-indigo-100/80 min-h-screen sm:min-h-0 sm:rounded-3xl shadow-xl flex flex-col overflow-hidden relative border border-indigo-100">
        
        <!-- Top Turkish Decorative Bar -->
        <div class="h-1.5 turkish-tile-bar w-full"></div>

        <!-- Header Section with Light Pattern Overlay -->
        <header class="relative turkish-light-pattern pt-9 pb-12 px-6 text-center border-b border-indigo-100/80 shadow-sm">
            <h1 class="text-2xl font-bold tracking-wider font-cinzel text-indigo-900 drop-shadow-sm">Contact Us</h1>
            <p class="text-indigo-600/80 text-xs mt-1 tracking-widest uppercase font-medium">Official Representative</p>
            
            <!-- Soft Turkish Nazar Eye Motif Badge -->
            <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 w-13 h-13 bg-white rounded-full flex items-center justify-center p-1 border border-indigo-200 shadow-md">
                <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center border border-indigo-300">
                    <div class="w-7 h-7 rounded-full bg-sky-200 flex items-center justify-center">
                        <div class="w-4 h-4 rounded-full bg-white flex items-center justify-center">
                            <div class="w-2 h-2 rounded-full bg-slate-900"></div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 px-6 pt-11 pb-8 flex flex-col justify-between">
            <div class="space-y-6">
                <!-- Title & Badge -->
                <div class="text-center mb-5">
                    <span class="inline-flex items-center gap-1 px-3 py-0.5 bg-indigo-100/80 border border-indigo-200 text-indigo-700 text-[11px] font-semibold rounded-full uppercase tracking-wider mb-2">
                        <svg class="w-3 h-3 fill-indigo-500" viewBox="0 0 24 24">
                            <path d="M12 2l2.4 7.2h7.6l-6.2 4.5 2.4 7.3-6.2-4.5-6.2 4.5 2.4-7.3-6.2-4.5h7.6z"/>
                        </svg>
                        Chinese Official
                    </span>
                    <h2 class="text-xl font-bold font-cinzel text-slate-800 tracking-wide mt-1">Direct Support Channel</h2>
                </div>

                <!-- Contact Details Card Stack -->
                <div class="space-y-3.5">
                    
                    <!-- WhatsApp Row Card -->
                    <div class="glass-card rounded-2xl p-4 flex items-center justify-between shadow-sm transition-all hover:shadow-md hover:border-indigo-300">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-10 h-10 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-600 flex items-center justify-center flex-shrink-0 shadow-inner">
                                <!-- WhatsApp Icon -->
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.572-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                                </svg>
                            </div>
                            <div>
                                <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">WhatsApp</p>
                                <p class="text-base font-bold text-slate-800 font-mono tracking-tight">+86 19925787935</p>
                            </div>
                        </div>
                        <button onclick="copyText('8619925787935', 'Number copied successfully!')" 
                                class="px-3.5 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 active:scale-95 text-white text-xs font-semibold rounded-xl transition-all shadow-sm shadow-indigo-200 flex items-center space-x-1">
                            <span>Copy Number</span>
                        </button>
                    </div>

                    <!-- ID Row Card -->
                    <div class="glass-card rounded-2xl p-4 flex items-center justify-between shadow-sm transition-all hover:shadow-md hover:border-indigo-300">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-10 h-10 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-600 flex items-center justify-center flex-shrink-0 shadow-inner">
                                <!-- Turkish Crescent / Tulip Star Icon -->
                                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                                    <path d="M12 2a10 10 0 1 0 10 10 10 10 0 0 1-10-10zm2 4a8 8 0 1 1-8 8 8 8 0 0 0 8-8zm5.5 2.5l1.2 2.4 2.7.4-1.9 1.9.5 2.7-2.5-1.3-2.5 1.3.5-2.7-1.9-1.9 2.7-.4z"/>
                                </svg>
                            </div>
                            <div>
                                <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Official ID</p>
                                <p class="text-base font-bold text-slate-800 font-mono tracking-wider">TR111</p>
                            </div>
                        </div>
                        <button onclick="copyText('TR111', 'ID copied successfully!')" 
                                class="px-3.5 py-2 bg-white hover:bg-slate-50 border border-indigo-200 text-indigo-700 active:scale-95 text-xs font-semibold rounded-xl transition-all shadow-sm flex items-center space-x-1">
                            <span>Copy ID</span>
                        </button>
                    </div>

                </div>
            </div>

            <!-- Footer Text -->
            <div class="mt-8 text-center space-y-1">
                <p class="text-xs font-semibold text-indigo-900/80 tracking-wide">Contact Us for Support & Inquiries</p>
                <p class="text-[11px] text-slate-500 tracking-wide">Copy the details above to connect.</p>
            </div>
        </main>
        
        <!-- Bottom Turkish Tile Accent Bar -->
        <div class="h-1 turkish-tile-bar w-full opacity-70"></div>
    </div>

    <!-- Light Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-white/95 border border-indigo-200 text-slate-700 text-xs sm:text-sm font-medium px-5 py-2.5 rounded-full shadow-lg pointer-events-none transition-all duration-300 opacity-0 transform translate-y-4 flex items-center space-x-2 z-50 backdrop-blur-md">
        <!-- Tiny Nazar Eye Icon inside Toast -->
        <div class="w-3.5 h-3.5 rounded-full bg-indigo-600 flex items-center justify-center">
            <div class="w-2.5 h-2.5 rounded-full bg-sky-200 flex items-center justify-center">
                <div class="w-1.5 h-1.5 rounded-full bg-white flex items-center justify-center">
                    <div class="w-0.5 h-0.5 rounded-full bg-slate-900"></div>
                </div>
            </div>
        </div>
        <span id="toast-message" class="text-slate-800 font-medium">Copied successfully!</span>
    </div>

    <script>
        let toastTimeout = null;

        function copyText(text, successMsg) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                showToast(successMsg);
            } catch (err) {
                showToast('Failed to copy text.');
            }
            
            document.body.removeChild(textArea);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            
            toastMsg.textContent = message;
            
            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }

            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2000);
        }
    </script>
</body>
</html>
